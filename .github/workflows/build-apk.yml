name: Build Money Heist EA APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APKs
        id: find_apk
        run: |
          mkdir -p dist
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoneyHeistEA-Android-APK
          path: dist/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Money Heist EA Android APK v1.0.${{ github.run_number }}
          body: |
            ## 🎭 Money Heist EA — Official Android App
            Automated mobile trading terminal powered by OmniShadow AI.

            ### 📲 How to install on your phone:
            1. Download the attached `.apk` file below directly on your Android phone.
            2. Tap the downloaded file and select **Install**.
            3. (If prompted, allow "Install from Unknown Sources" or browser permissions).
            4. Open Money Heist EA and connect to your server URL!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
